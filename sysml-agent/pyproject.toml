[project]
name = "sysml-agent"
version = "0.1.0"
description = "SysML v2 Creator Agent — transforms the Engineering Knowledge Agent's semantic model into a valid, traceable SysML v2 model."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    "openai>=2.0",
    "python-dotenv>=1.0",
    "jupyter_client>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
