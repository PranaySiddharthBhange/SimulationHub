[project]
name = "engineering-agent"
version = "0.1.0"
description = "Engineering Knowledge / Document Agent — ingests engineering documents into evidence-backed, versioned knowledge, and exposes it to downstream agents via LangGraph + Deep Agents."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "langgraph>=1.0",
    "deepagents>=0.7",
    "langchain-openai>=1.0",
    "openai>=2.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
