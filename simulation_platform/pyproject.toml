[project]
name = "simulation-platform"
version = "0.1.0"
description = "Whole-problem engineering reasoning, SysML v2, and verified Modelica simulation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "openai>=2.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "jupyter_client>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
simulation-platform = "simulation_platform.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
